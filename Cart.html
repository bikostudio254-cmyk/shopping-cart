<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPPING CART</title>
    <link rel="stylesheet" href="Cart.css">
</head>
<body>
    <h1>My shopping cart</h1>

    <button class="cookies-button">
        Cookies - ksh 100
    </button>

    <button class="cakes-button">Cakes - ksh 250</button>

    <div class="product-container">
        <h2>Your Cart</h2>
        <p class="cart-items">No items yet</p>

        <p class="total-price">Total: ksh 0</p>

        <button class="clear-cart-button">Clear Cart</button>

        <div class="product-card">
            <p>Cookies</p>
            <button class="cookies-minus">-</button>
            <button class="cookies-plus">+</button>
        </div> 

        <div class="product-card">
            <p>Cakes</p>
            <button class="cakes-minus">-</button>
            <button class="cakes-plus">+</button>
        </div>

    </div>

    <script src="Cart.js"></script>
</body>
</html>
